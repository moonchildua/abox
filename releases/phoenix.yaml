apiVersion: v1
kind: Namespace
metadata:
  name: phoenix
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: phoenix
  namespace: flux-system
spec:
  interval: 1h
  url: oci://registry-1.docker.io/arizephoenix/phoenix-helm
  ref:
    tag: "12.0.10"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phoenix
  namespace: phoenix
spec:
  interval: 1h
  releaseName: phoenix
  chartRef:
    kind: OCIRepository
    name: phoenix
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # The cluster routes through the agentgateway Gateway, not an Ingress.
    ingress:
      enabled: false
    # Left empty the chart fills every key with `randAlphaNum 32`, which is a
    # fresh roll on each render. Phoenix validates PHOENIX_SECRET and
    # PHOENIX_ADMIN_SECRET at boot (32+ chars, upper, lower, digit) and a roll
    # with no digit lands ~0.4% of the time, after which the pod crashloops:
    #
    #   ValueError: Phoenix secret at least one digit
    #
    # Pinning also stops the secret changing on every helm upgrade, which would
    # otherwise invalidate every issued token. Same reasoning as neo4j's
    # password: local sandbox, no secret management. The remaining keys keep
    # the chart defaults (postgres password must match database.postgres).
    auth:
      secret:
        - key: PHOENIX_SECRET
          value: "abox-phoenix-secret-0123456789-ABCDEFGHIJ"
        - key: PHOENIX_ADMIN_SECRET
          value: "abox-phoenix-admin-0123456789-ABCDEFGHIJ"
        - key: PHOENIX_POSTGRES_PASSWORD
          value: "postgres"
        - key: PHOENIX_SMTP_PASSWORD
          value: ""
    # The chart's startup probe allows 31s (periodSeconds 1 x failureThreshold
    # 30). Phoenix runs Alembic migrations against Postgres on first boot, which
    # takes longer than that on KinD, so the probe kills the container before it
    # ever binds :6006 and it restarts forever:
    #
    #   Startup probe failed: dial tcp 10.244.2.10:6006: connect: connection refused
    #   Container phoenix failed startup probe, will be restarted
    #
    # Widen the budget to 10 minutes. Liveness and readiness are left alone --
    # they only start counting once the startup probe succeeds.
    healthChecks:
      startupProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 120
